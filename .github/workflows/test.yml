name: Test
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}

jobs:
  test:
    # Pinned to 24.04: the ubuntu-latest image moved to Ubuntu 26.04, where the
    # Swift test runner crashes at runtime (SIGILL/SIGABRT, "failed to suspend
    # thread"). This is unrelated to the project code; revisit once 26.04 works.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
      - name: Test
        run: |
          set -ex

          swift test

          (cd Resources/parsers/50800 && swift test)
          (cd Resources/parsers/50900 && swift test)
          (cd Resources/parsers/51000 && swift test)
          (cd Resources/parsers/60000 && swift test)
          (cd Resources/parsers/60100 && swift test)
          (cd Resources/parsers/60200 && swift test)
          (cd Resources/parsers/60300 && swift test)
          (cd Resources/parsers/60400 && swift test)
          (cd Resources/parsers/trunk && swift test)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        run: |
          set -ex

          IMAGE_TAG=swiftfiddle/swift-ast-explorer.com:latest

          docker build --rm --no-cache --build-arg FONTAWESOME_TOKEN=${{ env.FONTAWESOME_TOKEN }} --tag ${IMAGE_TAG} .
          docker push ${IMAGE_TAG}
